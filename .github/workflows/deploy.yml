name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  # Cho phép bấm nút chạy thủ công trên GitHub nếu cần
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push sang Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Đồng bộ toàn bộ code sang đúng kho Hugging Face Space của bạn
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing required secret: HF_TOKEN"
            exit 1
          fi
          git push --force "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/TuanAnh0305/youtube-sentiment-api" main
