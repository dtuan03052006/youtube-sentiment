name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is missing! Please configure HF_TOKEN in GitHub repository secrets."
            exit 1
          fi
          git push --force https://oauth2:${YOUTUBE_SENTIMENTS}@huggingface.co/spaces/TuanAnh0305/youtube-sentiment HEAD:main
