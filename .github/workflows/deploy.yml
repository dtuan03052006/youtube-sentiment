name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push sang Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing in GitHub Secrets. Skipping sync to Hugging Face Space."
            exit 0
          fi
          git push --force https://oauth2:${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}@huggingface.co/spaces/TuanAnh0305/youtube-sentiment-api HEAD:main
